[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wafghost"
version = "0.1.0"
description = "WafGhost: LLM-Driven Iterative WAF Evasion Fuzzer"
readme = "README.md"
authors = [
    { name = "AS Vishwakarma", email = "asvishwakarma@users.noreply.github.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "mcp>=1.0.0",
    "google-generativeai>=0.3.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
wafghost = "wafghost.cli:main"
mcp-wafghost = "wafghost.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wafghost*"]
